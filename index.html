<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Strikeout Predictions</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --bg-secondary: #f5f4f0;
      --bg-tertiary: #eeece6;
      --text-primary: #1a1a18;
      --text-secondary: #5f5e5a;
      --text-tertiary: #9b9a95;
      --border: rgba(0,0,0,0.12);
      --border-md: rgba(0,0,0,0.22);
      --radius-md: 8px;
      --radius-lg: 12px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1e1e1c;
        --bg-secondary: #2a2a27;
        --bg-tertiary: #333330;
        --text-primary: #f0ede6;
        --text-secondary: #a8a69f;
        --text-tertiary: #6b6964;
        --border: rgba(255,255,255,0.1);
        --border-md: rgba(255,255,255,0.2);
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg-tertiary);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 2.5rem 1rem 4rem;
    }

    .page-wrapper {
      max-width: 1000px;
      margin: 0 auto;
    }

    .page { max-width: 100%; }

    .content-with-sidebar {
      display: grid;
      grid-template-columns: 200px 1fr;
      gap: 20px;
      align-items: start;
    }

    .metrics-sidebar {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1rem;
    }

    .model-toggle {
      display: flex;
      gap: 8px;
      margin-right: 12px;
    }

    .model-toggle .sort-btn {
      padding: 5px 13px;
      font-size: 13px;
      white-space: nowrap;
    }

    .metric-card {
      background: transparent;
      border: none;
      padding: 0.5rem 0;
      border-bottom: 0.5px solid var(--border-md);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .metric-card:last-child {
      border-bottom: none;
    }

    .metric-content {
      flex: 1;
    }

    .metric-label {
      font-size: 11px;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    .metric-percentage {
      font-size: 20px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .metric-odds {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-top: 3px;
      font-variant-numeric: tabular-nums;
    }

    .metric-odds-na {
      color: var(--text-tertiary);
      font-weight: 400;
    }

    .metric-ring {
      width: 60px;
      height: 60px;
      flex-shrink: 0;
    }

    .header { text-align: center; margin-bottom: 2.5rem; }
    .header-eyebrow {
      font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--text-tertiary); margin-bottom: 0.5rem;
    }
    .header-title { font-size: 28px; font-weight: 500; color: var(--text-primary); margin-bottom: 0.35rem; }
    .header-date  { font-size: 14px; color: var(--text-secondary); }
    .stitches { display: flex; justify-content: center; gap: 6px; margin-top: 1.2rem; }
    .stitch {
      width: 20px; height: 5px; border-radius: 3px;
      background: var(--bg-secondary); border: 0.5px solid var(--border-md);
    }

    .summary-bar {
      display: grid; grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 10px; margin-bottom: 1.5rem;
    }
    .stat-card {
      background: var(--bg); border-radius: var(--radius-md);
      padding: 0.9rem 1rem; border: 0.5px solid var(--border);
    }
    .stat-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
    .stat-value { font-size: 22px; font-weight: 500; color: var(--text-primary); }

    .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 1rem; }
    .sort-btn {
      font-size: 13px; padding: 5px 13px; border-radius: var(--radius-md);
      border: 0.5px solid var(--border-md); background: transparent;
      color: var(--text-secondary); cursor: pointer; font-family: inherit;
      transition: background 0.15s, color 0.15s;
    }
    .sort-btn:hover { background: var(--bg-secondary); color: var(--text-primary); }
    .sort-btn.active { background: var(--bg); color: var(--text-primary); border-color: var(--border-md); }

    .pitcher-list { display: flex; flex-direction: column; gap: 10px; }

    .pitcher-card {
      background: var(--bg); border: 0.5px solid var(--border);
      border-radius: var(--radius-lg); padding: 1rem 1.25rem;
      display: flex; align-items: center; gap: 16px; transition: border-color 0.15s;
    }
    .pitcher-card:hover { border-color: var(--border-md); }

    .rank { font-size: 12px; color: var(--text-tertiary); width: 20px; text-align: right; flex-shrink: 0; }
    .avatar {
      width: 42px; height: 42px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 500; flex-shrink: 0;
      background: var(--bg-secondary); overflow: hidden;
    }
    .avatar img { width: 32px; height: 32px; object-fit: contain; display: block; }
    .pitcher-info { flex: 1; min-width: 0; }
    .pitcher-name {
      font-size: 15px; font-weight: 500; color: var(--text-primary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .pitcher-team {
      font-size: 12px; color: var(--text-secondary); margin-top: 1px; margin-bottom: 1px;
    }
    .badge { display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 99px; font-weight: 500; margin-top: 3px; }
    .badge-high { background: #E1F5EE; color: #0F6E56; }
    .badge-mid  { background: #FAEEDA; color: #854F0B; }
    .badge-low  { background: #F1EFE8; color: #5F5E5A; }

    .bar-wrap { flex: 1; max-width: 120px; min-width: 60px; }
    .bar-track { height: 4px; background: var(--bg-tertiary); border-radius: 2px; overflow: hidden; }
    .bar-fill  { height: 100%; border-radius: 2px; }

    .k-block { text-align: right; flex-shrink: 0; }
    .k-num   { font-size: 24px; font-weight: 500; color: var(--text-primary); line-height: 1; }
    .k-label { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; letter-spacing: 0.06em; }

    .loading-state {
      text-align: center; padding: 3rem 1rem;
      color: var(--text-secondary); font-size: 14px;
      background: var(--bg); border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
    }
    .spinner {
      width: 28px; height: 28px; border-radius: 50%;
      border: 2px solid var(--border-md);
      border-top-color: var(--text-secondary);
      animation: spin 0.8s linear infinite;
      margin: 0 auto 0.75rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-state {
      text-align: center; padding: 2rem 1rem;
      background: var(--bg); border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
    }
    .error-title { font-size: 15px; font-weight: 500; color: var(--text-primary); margin-bottom: 0.4rem; }
    .error-msg   { font-size: 13px; color: var(--text-secondary); margin-bottom: 1rem; font-family: monospace; }
    .retry-btn {
      font-size: 13px; padding: 6px 16px; border-radius: var(--radius-md);
      border: 0.5px solid var(--border-md); background: transparent;
      color: var(--text-primary); cursor: pointer; font-family: inherit;
    }
    .retry-btn:hover { background: var(--bg-secondary); }

    .footer { text-align: center; margin-top: 2.5rem; font-size: 12px; color: var(--text-tertiary); }
    .last-updated { margin-top: 0.35rem; color: var(--text-secondary); }
    .ball-row { display: flex; justify-content: center; gap: 8px; margin-top: 0.8rem; }
    .baseball {
      width: 14px; height: 14px; border-radius: 50%;
      border: 0.5px solid var(--border-md); background: var(--bg);
      display: flex; align-items: center; justify-content: center;
    }
    .seam { width: 8px; height: 8px; border: 0.5px solid var(--border-md); border-radius: 50% 0 50% 0; }

    @media (max-width: 480px) {
      .bar-wrap { display: none; }
      .header-title { font-size: 22px; }
      .content-with-sidebar { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>




<div class="page-wrapper">

<div class="page">

  <div class="header">
    <div class="header-eyebrow">AI strikeout predictions</div>
    <div class="header-title">Today's starting pitchers</div>
    <div class="header-date" id="todays-date"></div>
    <div class="stitches">
      <div class="stitch"></div><div class="stitch"></div><div class="stitch"></div>
      <div class="stitch"></div><div class="stitch"></div>
    </div>
  </div>

  <div class="summary-bar" id="summary-bar"></div>

  <div class="content-with-sidebar">
    <div>
      <div class="toolbar" id="model-toolbar" style="display:none">
        <div class="model-toggle">
          <button class="sort-btn active" id="regression-toggle" onclick="switchModel('regression')">Regression</button>
          <button class="sort-btn" id="xgboost-toggle" onclick="switchModel('xgboost')">XGBoost</button>
        </div>
      </div>
      <div class="metrics-sidebar" id="metrics-sidebar">
        <div id="metrics-sidebar-body"></div>
      </div>
    </div>
    <div>
      <div class="toolbar" id="toolbar" style="display:none">
        <button class="sort-btn active" onclick="sortBy('default', this)">Default</button>
        <button class="sort-btn" onclick="sortBy('desc', this)">Most K's first</button>
        <button class="sort-btn" onclick="sortBy('asc', this)">Fewest K's first</button>
        <button class="sort-btn" onclick="sortBy('alpha', this)">A–Z</button>
      </div>
      <div class="pitcher-list" id="pitcher-list"></div>
    </div>
  </div>

  <div class="footer">
    Model predictions only — not a substitute for your own analysis.
    <div class="last-updated" id="last-updated"></div>
    <div class="ball-row">
      <div class="baseball"><div class="seam"></div></div>
      <div class="baseball"><div class="seam" style="transform:rotate(90deg)"></div></div>
      <div class="baseball"><div class="seam"></div></div>
    </div>
  </div>

</div>

<script>
  const BAR_COLORS = ["#534AB7","#1D9E75","#D85A30","#378ADD","#639922","#D4537E","#BA7517","#E24B4A"];

  let pitchers = [];
  let originalOrder = [];
  let activeModel = "regression";
  const modelCache = {
    regression: null,
    xgboost: null,
  };

  const MODEL_FILES = {
    regression: {
      metrics: "model_and_scalers/regression_performance_metrics.json",
      predictions: "regression_predictions.json",
    },
    xgboost: {
      metrics: "model_and_scalers/xgboost_performance_metrics.json",
      predictions: "xgboost_predictions.json",
    },
  };

  const METRIC_LABELS = [
    { key: "perfect_guess", label: "Perfect guess" },
    { key: "within_1", label: "Within 1 K" },
    { key: "within_2", label: "Within 2 K" },
    { key: "within_3", label: "Within 3 K" },
    { key: "within_4", label: "Within 4 K" },
    { key: "within_5", label: "Within 5 K" },
    { key: "within_6", label: "Within 6 K" },
  ];

  function initDate() {
    const d = new Date();
    document.getElementById("todays-date").textContent =
      d.toLocaleDateString("en-US", { weekday: "long", year: "numeric", month: "long", day: "numeric" });
  }

  function showLoading() {
    document.getElementById("model-toolbar").style.display = "flex";
    document.getElementById("toolbar").style.display = "none";
    document.getElementById("summary-bar").innerHTML = "";
    document.getElementById("pitcher-list").innerHTML = `
      <div class="loading-state">
        <div class="spinner"></div>
        Running predictions — this may take a moment...
      </div>`;
    document.getElementById("metrics-sidebar-body").innerHTML = `
      <div class="loading-state" style="padding: 1rem;">
        <div class="spinner"></div>
        Loading model metrics...
      </div>`;
  }

  function showError(msg) {
    document.getElementById("pitcher-list").innerHTML = `
      <div class="error-state">
        <div class="error-title">Could not load predictions</div>
        <div class="error-msg">${msg}</div>
        <button class="retry-btn" onclick="loadModelData()">Try again</button>
      </div>`;
  }

  function initSummary() {
    const ks = pitchers.map(p => p.k);
    const avg = (ks.reduce((a, b) => a + b, 0) / ks.length).toFixed(1);
    const max = Math.max(...ks);
    const leader = pitchers.find(p => p.k === max).name.split(" ").pop();
    document.getElementById("summary-bar").innerHTML = `
      <div class="stat-card"><div class="stat-label">Pitchers today</div><div class="stat-value">${pitchers.length}</div></div>
      <div class="stat-card"><div class="stat-label">Avg predicted K's</div><div class="stat-value">${avg}</div></div>
      <div class="stat-card"><div class="stat-label">K leader</div><div class="stat-value">${leader}</div></div>
    `;
  }

  function setLastUpdated(updatedAt) {
    const el = document.getElementById("last-updated");
    if (!updatedAt) {
      el.textContent = "";
      return;
    }

    const parsed = new Date(updatedAt);
    if (Number.isNaN(parsed.getTime())) {
      // Keep compatibility with legacy non-ISO timestamp strings.
      el.textContent = `Last updated: ${updatedAt}`;
      return;
    }

    const centralText = parsed.toLocaleString("en-US", {
      month: "short",
      day: "numeric",
      year: "numeric",
      hour: "numeric",
      minute: "2-digit",
      timeZone: "America/Chicago",
      timeZoneName: "short",
    });
    el.textContent = `Last updated: ${centralText}`;
  }

  function setActiveModelButton() {
    document.getElementById("regression-toggle").classList.toggle("active", activeModel === "regression");
    document.getElementById("xgboost-toggle").classList.toggle("active", activeModel === "xgboost");
  }

  function renderMetricsRing(percentage, index) {
    const colors = [
      { start: "#534AB7", end: "#378ADD" },
      { start: "#1D9E75", end: "#0F6E56" },
      { start: "#D85A30", end: "#BA7517" },
      { start: "#378ADD", end: "#1D9E75" },
      { start: "#639922", end: "#378ADD" },
      { start: "#D4537E", end: "#D85A30" },
      { start: "#BA7517", end: "#639922" }
    ];
    
    const color = colors[index % colors.length];
    const gradientId = `grad-${index}`;
    const radius = 25;
    const circumference = 2 * Math.PI * radius;
    const offset = circumference - (percentage / 100) * circumference;
    
    return `<svg class="metric-ring" viewBox="0 0 60 60">
      <defs>
        <linearGradient id="${gradientId}" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:${color.start};stop-opacity:1" />
          <stop offset="100%" style="stop-color:${color.end};stop-opacity:1" />
        </linearGradient>
      </defs>
      <circle cx="30" cy="30" r="${radius}" fill="none" stroke="var(--border)" stroke-width="6"/>
      <circle cx="30" cy="30" r="${radius}" fill="none" stroke="url(#${gradientId})" stroke-width="6" 
        stroke-dasharray="${circumference}" stroke-dashoffset="${offset}" 
        stroke-linecap="round" style="transform: rotate(-90deg); transform-origin: 30px 30px;"/>
      <text x="30" y="35" font-size="12" font-weight="500" text-anchor="middle" fill="var(--text-primary)">${Math.round(percentage)}</text>
      <text x="30" y="48" font-size="8" text-anchor="middle" fill="var(--text-tertiary)">%</text>
    </svg>`;
  }

  function renderMetrics(data) {
    const sidebar = document.getElementById("metrics-sidebar-body");
    if (!data) {
      sidebar.innerHTML = '<div class="metric-card" style="color: var(--text-secondary);">No metrics available</div>';
      return;
    }

    const cards = METRIC_LABELS.map((item, idx) => {
      const raw = data?.[item.key] || "0 %";
      const numeric = parseFloat(String(raw).replace(/[^\d.]/g, "")) || 0;
      const oddsRaw = data?.[`${item.key}_breakeven_odds`];
      const oddsHtml = oddsRaw
        ? `<div class="metric-odds${oddsRaw === "N/A" ? " metric-odds-na" : ""}">${oddsRaw === "N/A" ? "N/A" : oddsRaw}</div>`
        : "";
      return `
        <div class="metric-card">
          <div class="metric-content">
            <div class="metric-label">${item.label}</div>
            <div class="metric-percentage">${raw}</div>
            ${oddsHtml}
          </div>
          ${renderMetricsRing(numeric, idx)}
        </div>`;
    }).join("");

    sidebar.innerHTML = cards;
  }

  function renderModelData(modelKey) {
    const model = modelCache[modelKey];
    if (!model) {
      return;
    }

    activeModel = modelKey;
    setActiveModelButton();
    renderMetrics(model.metrics);
    renderPredictions(model.predictions);
  }

  function switchModel(modelKey) {
    if (activeModel === modelKey && modelCache[modelKey]) {
      return;
    }

    renderModelData(modelKey);
  }

  async function loadModelData() {
    showLoading();
    try {
      const [regMetricsRes, xgbMetricsRes, regPredictionsRes, xgbPredictionsRes] = await Promise.all([
        fetch(MODEL_FILES.regression.metrics),
        fetch(MODEL_FILES.xgboost.metrics),
        fetch(MODEL_FILES.regression.predictions),
        fetch(MODEL_FILES.xgboost.predictions),
      ]);

      if (!regMetricsRes.ok || !xgbMetricsRes.ok || !regPredictionsRes.ok || !xgbPredictionsRes.ok) {
        throw new Error("One or more model files could not be loaded.");
      }

      modelCache.regression = {
        metrics: await regMetricsRes.json(),
        predictions: await regPredictionsRes.json(),
      };
      modelCache.xgboost = {
        metrics: await xgbMetricsRes.json(),
        predictions: await xgbPredictionsRes.json(),
      };

      renderModelData(activeModel);
    } catch (err) {
      document.getElementById("metrics-sidebar-body").innerHTML = '<div class="metric-card" style="color: var(--text-secondary); font-size: 12px;">Metrics unavailable</div>';
      const hint = window.location.protocol === "file:"
        ? "Open this page through a local server (e.g. python -m http.server 10000), not as a file."
        : "Make sure all four JSON files exist and contain valid JSON.";
      showError(err?.message ? `${err.message} — ${hint}` : hint);
    }
  }

  function getInitials(name) {
    return name.split(" ").map(w => w[0]).join("").slice(0, 2).toUpperCase();
  }

  const AVATAR_COLORS = [
    { bg: "#EEEDFE", txt: "#3C3489" },
    { bg: "#E1F5EE", txt: "#085041" },
    { bg: "#FAECE7", txt: "#712B13" },
    { bg: "#E6F1FB", txt: "#0C447C" },
    { bg: "#EAF3DE", txt: "#27500A" },
    { bg: "#FBEAF0", txt: "#72243E" },
    { bg: "#FAEEDA", txt: "#633806" },
    { bg: "#FCF0F0", txt: "#791F1F" },
  ];

  // Map truncated team names from statsapi to logo filenames
  const TEAM_NAME_MAP = {
    "D-backs": "D-backs",
    "Red": "R-sox",
    "Blue": "Bluejays",
    "White": "W-sox",
    //"Angels": "Angles",
    //"Phillies": "Philies",
  };

  // Map truncated team names to full display names
  const TEAM_DISPLAY_MAP = {
    "Red": "Red Sox",
    "Blue": "Blue Jays",
    "White": "White Sox",
  };

  function getDisplayName(team) {
    return TEAM_DISPLAY_MAP[team] || team;
  }

  function getLogoPath(team) {
    const mapped = TEAM_NAME_MAP[team] || team;
    return `mlb_teams_logo_svg/light/${mapped}.svg`;
  }

  function logoFallback(el, name, idx) {
    const col = AVATAR_COLORS[idx % AVATAR_COLORS.length];
    el.parentElement.style.background = col.bg;
    el.parentElement.innerHTML = '<span style="color:' + col.txt + ';font-size:13px;font-weight:500">' + getInitials(name) + '</span>';
  }

  function getAvatarHtml(team, name, idx) {
    if (team) {
      const path = getLogoPath(team);
      return `<img src="${path}" alt="${team}" onerror="logoFallback(this,'${name}',${idx})">`;
    }
    const col = AVATAR_COLORS[idx % AVATAR_COLORS.length];
    return `<span style="color:${col.txt};font-size:13px;font-weight:500">${getInitials(name)}</span>`;
  }

  function getBadge(k, max) {
    if (k >= max - 1) return '<span class="badge badge-high">elite stuff</span>';
    if (k >= 7)       return '<span class="badge badge-mid">solid outing</span>';
    return                   '<span class="badge badge-low">ground ball threat</span>';
  }

  function renderList(list) {
    const max = Math.max(...list.map(p => p.k));
    document.getElementById("pitcher-list").innerHTML = list.map((p, rank) => {
      const col    = AVATAR_COLORS[p.idx % AVATAR_COLORS.length];
      const barCol = BAR_COLORS[p.idx % BAR_COLORS.length];
      const pct    = Math.round((p.k / (max + 2)) * 100);
      return `
        <div class="pitcher-card">
          <div class="rank">${rank + 1}</div>
          <div class="avatar" id="avatar-${rank}">${getAvatarHtml(p.team, p.name, p.idx)}</div>
          <div class="pitcher-info">
            <div class="pitcher-name">${p.name}</div>
            ${p.team ? `<div class="pitcher-team">${getDisplayName(p.team)}</div>` : ''}
            <div>${getBadge(p.k, max)}</div>
          </div>
          <div class="bar-wrap">
            <div class="bar-track">
              <div class="bar-fill" style="width:${pct}%;background:${barCol}"></div>
            </div>
          </div>
          <div class="k-block">
            <div class="k-num">${p.k}</div>
            <div class="k-label">K's</div>
          </div>
        </div>`;
    }).join("");
  }

  function renderPredictions(data) {
    if (data.status !== "ok") {
      showError(data.message || "Unknown error from server.");
      return;
    }

    setLastUpdated(data.updated_at || "");

    pitchers = data.predictions.map((p, i) => ({ ...p, idx: i }));
    originalOrder = [...pitchers];

    if (pitchers.length === 0) {
      document.getElementById("pitcher-list").innerHTML =
        '<div class="loading-state">No games scheduled for today.</div>';
      return;
    }

    if (!data.updated_at) {
      const loadedAt = new Date().toLocaleString("en-US", {
        weekday: "short",
        month: "short",
        day: "numeric",
        year: "numeric",
        hour: "numeric",
        minute: "2-digit",
      });
      setLastUpdated(loadedAt);
    }

    initSummary();
    renderList(pitchers);
    document.getElementById("model-toolbar").style.display = "flex";
    document.getElementById("toolbar").style.display = "flex";
  }

  function sortBy(mode, btn) {
    document.querySelectorAll(".sort-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    let sorted = [...pitchers];
    if      (mode === "desc")  sorted.sort((a, b) => b.k - a.k);
    else if (mode === "asc")   sorted.sort((a, b) => a.k - b.k);
    else if (mode === "alpha") sorted.sort((a, b) => a.name.localeCompare(b.name));
    else                       sorted = [...originalOrder];
    renderList(sorted);
  }

  async function loadPredictions() {
    await loadModelData();
  }

  initDate();
  setActiveModelButton();
  loadModelData();
</script>

</body>
</html>
